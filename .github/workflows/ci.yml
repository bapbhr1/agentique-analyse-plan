name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Sous-ensemble léger : les tests n'ont besoin ni d'easyocr ni de torch.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest==8.3.4 ruff==0.9.6 \
            openai==3.8.0 python-dotenv==1.2.3 \
            opencv-python-headless==5.0.0.93 numpy==2.5.2 Pillow==12.3.0

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
