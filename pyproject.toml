[project]
name = "agentique-analyse-plan"
version = "0.1.0"
description = "Système multi-agents (orchestrateur + workers) de description de plans techniques."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # longueur de ligne : tolérée dans les prompts/tables inline

[tool.pytest.ini_options]
testpaths = ["tests"]
